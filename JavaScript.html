<html>
<head>
	<script src="scripts\JavaScript.js"></script>
	<link rel="stylesheet" href="css/myStyle.css">
</head>
<body>
<h1> JavaScript </h1>
<button onclick="buttonPressed()">Press This Button!</button>

<h1>Reading in values from textbox</h1>
<input type="text" id="txt1">
<br>
<br>
<button onclick="displayText()">Display Text </button>

<h1>Moving text from one textbox to another</h1>
<input type="text" id="txt2">
<br>
<br>
<button onclick="moveTextDown()">Move Text Down</button>
<button onclick="moveTextUp()">Move Text Up</button>

<br>
<br>
<input type="text" id="txt3">
<h1>Calculator</h1>
<input type="number" id="txtValue1" placeholder="Enter a number">
<br>
<button onclick="add()">+</button>
<button onclick="subtract()">-</button>
<button onclick="multiply()">*</button>
<button onclick="divide()">/</button>
<br>
<button onclick="equals()">=</button>
<button onclick="clearCalculator()">Clear</button><br>
<input type="text" id="txtCalcScreen" readonly placeholder="Calculation screen">
<input type="hidden" id="functionSelected" >
<br>
<input type="hidden" id="txtValue2">
<br>

<input type="hidden" id="txtAnswer" >

<br>

</body>

</html>
